_target_: src.event.lit_module.lit_transformer_v2.LitTransformerV2

# Model configuration
model:
  _target_: src.event.model.transformer_v2.EventTransformerV2
  d_model: 128
  nhead: 8
  num_layers: 4
  dropout: 0.1
  max_seq_len: 512
  pose_dim: 51

# Optimizer configuration - inherited from common config, can be overridden
optimizer_config: ${optimizer}

# Scheduler configuration - inherited from common config, can be overridden  
scheduler_config: ${scheduler}

# Loss function configuration
criterion_config:
  no_hit_weight: 0.01   # [0,0]
  hit_weight: 1.0       # [1,0]
  bounce_weight: 1.0    # [0,1]
  clarity_weight: 0.02

# Logging configuration
logging_config:
  save_validation_outputs: true
  save_validation_images: false
  max_samples: 5
  peak_thresh: 0.30

# Meta information
meta:
  name: transformer_v2
  output_type: "multilabel"
  description: "Event detection using Transformer architecture V2" 