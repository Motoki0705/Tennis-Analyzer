# @package _global_

# Event detection model configuration using TransformerV2

defaults:
  - litmodule: transformer_v2
  - litdatamodule: event_data
  - /common/trainer: default
  - /common/callbacks: default
  - /common/optimizer: adamw
  - /common/scheduler: cosine_with_warmup
  - _self_

# Global configuration
seed: 42
module_name: event

# Balanced dataset path (if specified)
balanced_dataset_path: null

# Hydra configuration  
hydra:
  output_subdir: hydra_outputs/${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: outputs/train/${module_name}/${litmodule.meta.name}/${now:%Y-%m-%d_%H-%M-%S} 