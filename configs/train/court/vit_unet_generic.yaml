# @package _global_

# デフォルト設定
defaults:
  - model: vit_unet
  - litmodule: default
  - litdatamodule: court_data
  - trainer: default
  - callbacks: default
  - _self_

# VitUNet specific optimizer override
litmodule:
  optimizer_params:
    lr: 0.001  # Higher learning rate for transformer models
    weight_decay: 0.0001
  scheduler_params:
    warmup_epochs: 5  # Longer warmup for transformer
    max_epochs: 100

# 再現性のための乱数シード
seed: 42