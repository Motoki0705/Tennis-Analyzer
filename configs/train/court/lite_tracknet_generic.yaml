# @package _global_

# Court detection model configuration using LiteTrackNet

defaults:
  - model: lite_tracknet
  - litmodule: default
  - litdatamodule: court_data
  - /common/trainer: default
  - /common/callbacks: default
  - /common/optimizer: adamw
  - /common/scheduler: cosine_with_warmup
  - _self_

# Global configuration
seed: 42
module_name: court

# Hydra configuration  
hydra:
  output_subdir: hydra_outputs/${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: outputs/train/${module_name}/${model.name}/${now:%Y-%m-%d_%H-%M-%S}