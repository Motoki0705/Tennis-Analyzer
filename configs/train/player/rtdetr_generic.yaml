# @package _global_

# Player detection model configuration using RT-DETR

defaults:
  - model: rtdetr
  - litmodule: default
  - litdatamodule: coco_data
  - /common/trainer: default
  - /common/callbacks: default
  - /common/optimizer: adamw
  - /common/scheduler: cosine
  - _self_

# Global configuration
seed: 42
module_name: player

# Hydra configuration  
hydra:
  output_subdir: hydra_outputs/${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: outputs/train/${module_name}/${model.name}/${now:%Y-%m-%d_%H-%M-%S}