# @package _global_

# hydra設定
hydra:
  output_subdir: hydra_outputs/${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: .

# デフォルト設定
defaults:
  # Model configuration
  - model: rtdetr
  
  # LightningModule configuration
  - litmodule: generic_detection
  
  - litdatamodule: coco_data
  - trainer: default
  - callbacks: default
  - _self_

# 再現性のための乱数シード
seed: 42