# @package _global_

# Ball detection model configuration using LiteTrackNet

defaults:
  - model: lite_tracknet
  - litmodule: default
  - litdatamodule: 3_frames_cat_last
  - /common/trainer: default
  - /common/callbacks: default
  - /common/optimizer: adamw
  - /common/scheduler: cosine_with_warmup
  - _self_

# Global configuration
seed: 42
module_name: ball

# Hydra configuration  
hydra:
  output_subdir: hydra_outputs/${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: outputs/train/${module_name}/${model.name}/${now:%Y-%m-%d_%H-%M-%S}