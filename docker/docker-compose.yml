version: '3.8'

services:
  # 開発用サービス: 対話的なシェル操作やデバッグに使用
  tennis-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    container_name: tennis_systems_dev
    volumes:
      # プロジェクトルートをコンテナの /workspace にマウントします。
      # これで、datasets, checkpoints, outputs も自動的に含まれます。
      - ..:/workspace
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
      - DEBIAN_FRONTEND=noninteractive
    # コンテナを起動し続けるための設定
    stdin_open: true
    tty: true
    # ホストネットワークを利用してポートアクセスを容易にします
    network_mode: host

  # コマンド実行用サービス: 特定のスクリプトやテストを単発で実行
  tennis-run:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    container_name: tennis_systems_run
    volumes:
      # 開発用サービスとマウント設定を統一
      - ..:/workspace
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
    # このサービスは特定のコマンド実行時にのみ使用されることを想定
    profiles:
      - tools